apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-mcp-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rotten-Banana/DB-MCP-Server
    targetRevision: main
    path: k8s
    plugin:
      name: argocd-vault-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: test        # ← your existing namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true